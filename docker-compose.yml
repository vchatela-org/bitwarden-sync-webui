# Production stack — pulls the published image from GHCR.
# For building from source instead, see docker-compose.dev.yml.
#
# QUICK START
# -----------
# 1. Copy the example config and fill in your values:
#      mkdir -p .config && cp config/targets.json.example .config/targets.json
#
# 2. Copy the env file and set at minimum UI_PASSWORD_HASH and SESSION_SECRET:
#      cp .env.example .env
#
# 3. Pull and start:
#      docker compose up
#
# 4. Open http://localhost:3000 and log in.
#
# VOLUMES
# -------
# ./.config  → /config   : read-only targets.json and Bitwarden profiles
# ./backups  → /backups  : backup archives written here on the host
# ./.data    → /data     : Bitwarden CLI session data (profiles, keys)
#
# NOTE: The bw CLI requires a real Bitwarden account to run jobs.
# The UI will start and is fully navigable even without one — the
# config error is shown in the dashboard until a valid config is provided.

services:
  webui:
    image: ghcr.io/vchatela-org/bitwarden-sync-webui:latest
    pull_policy: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      CONFIG_PATH: /config/targets.json
      DATA_DIR: /data
      BW_FIFO_DIR: /run/bw-fifo
      PORT: "3000"
    volumes:
      - ./.config:/config:ro
      - ./backups:/backups
      - ./.data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
