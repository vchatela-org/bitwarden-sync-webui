---
# Optional NetworkPolicy — allows egress only to the home server and the EU cloud.
# Adjust the CIDR blocks to match your infrastructure.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bitwarden-webui
  namespace: bitwarden
spec:
  podSelector:
    matchLabels:
      app: bitwarden-webui
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 3000
  egress:
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Bitwarden EU cloud (vault.bitwarden.eu)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0   # Replace with vault.bitwarden.eu IP range
      ports:
        - port: 443
    # Home self-hosted server
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8  # Replace with your home server IP
      ports:
        - port: 443
        - port: 8443
