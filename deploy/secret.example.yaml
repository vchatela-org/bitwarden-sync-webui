---
# EXAMPLE ONLY — do not commit real secrets.
# In production, use SOPS, Sealed Secrets, or inject via Vault agent.
#
# UI_PASSWORD_HASH: generate with:
#   node -e "import('argon2').then(a=>a.hash('your-password')).then(console.log)"
# SESSION_SECRET: generate with:
#   node -e "console.log(require('crypto').randomBytes(48).toString('hex'))"
apiVersion: v1
kind: Secret
metadata:
  name: bitwarden-webui-secrets
  namespace: bitwarden
type: Opaque
stringData:
  UI_PASSWORD_HASH: "$argon2id$v=19$m=65536,t=3,p=4$EXAMPLE_REPLACE_ME"
  SESSION_SECRET: "REPLACE_WITH_A_LONG_RANDOM_STRING_AT_LEAST_48_CHARS"
