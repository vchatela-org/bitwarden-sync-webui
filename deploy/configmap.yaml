---
# ConfigMap — mount as /config/targets.json inside the pod.
# Edit the values below; the structure is validated by the server at startup.
apiVersion: v1
kind: ConfigMap
metadata:
  name: bitwarden-webui-config
  namespace: bitwarden
data:
  targets.json: |
    {
      "vaults": [
        { "key": "cloud", "name": "Cloud", "serverUrl": "https://vault.bitwarden.eu" },
        { "key": "home", "name": "Home", "serverUrl": "https://bitwarden.example.internal" }
      ],
      "backupFolder": "/backups",
      "bitwardenConfigDir": "/data/bitwarden",
      "users": [
        { "key": "val",    "email": "val@example.com",    "displayName": "Val", "from": "cloud", "to": "home" },
        { "key": "mathou", "email": "mathou@example.com", "displayName": "Mathou", "from": "cloud", "to": "home" }
      ],
      "orgs": [
        {
          "key": "org",
          "name": "My Organisation",
          "owner": "val",
          "from": "cloud",
          "to": "home",
          "orgIds": {
            "cloud": "00000000-0000-0000-0000-000000000001",
            "home": "00000000-0000-0000-0000-000000000002"
          }
        }
      ],
      "retention": { "keepDaily": 7, "keepMonthly": 12 },
      "importGuard": { "minSourceRatio": 0.5, "blockOnEmptySource": true },
      "homeLogoutAfterImport": true
    }
