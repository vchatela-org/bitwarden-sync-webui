name: Fix lockfile

on:
  push:
    branches:
      - dependabot/npm_and_yarn/server/vitest-5.0.0
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: dependabot/npm_and_yarn/server/vitest-5.0.0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      - name: Regenerate package-lock.json
        run: npm install --package-lock-only

      - name: Commit and push lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet || (git commit -m "chore: regenerate package-lock.json for vitest 5" && git push)
