name: ✅ PR checks

# CodeQL was the only thing running on pull requests, so nothing built the app or
# ran the tests until the release job did — after the merge. That is how the EPIPE
# bug in runBw (#29) reached main: it was caught by the release job, which fails
# too late to stop anything.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: 🧪 Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Matches the node:26-alpine base the image is built on.
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Dependency bumps are most of the PR traffic here, so fail on a known
      # advisory rather than waiting for the next Dependabot alert to land.
      - name: Audit
        run: npm audit --audit-level=high
