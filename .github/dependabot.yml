version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/server"
    cooldown:
      default-days: 2
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/web"
    cooldown:
      default-days: 2
    schedule:
      interval: "weekly"

  # Bitwarden CLI version pin baked into the runtime image. It lives in an npm
  # manifest because the docker updater below only rewrites FROM tags, so an
  # ARG in the Dockerfile would never get a bump PR. The Dockerfile reads the
  # version out of that manifest at build time.
  - package-ecosystem: "npm"
    directory: "/docker/bw-cli"
    cooldown:
      default-days: 2
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/"
    cooldown:
      default-days: 2
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      default-days: 2
    schedule:
      interval: "weekly"
